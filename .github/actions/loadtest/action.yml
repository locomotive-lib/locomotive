name: 'CI Load Test'
description: 'Load test with Locomotive: branch-aware baseline, job summary, JUnit results and a pull request comment'

inputs:
  config:
    description: 'Path to loconfig config file'
    required: false
    default: 'loconfig.json'

  users:
    description: 'Override number of users'
    required: false

  run_time:
    description: 'Override run time (e.g., 30s, 1m)'
    required: false

  args:
    description: 'Extra arguments for `loco ci`, e.g. "--processes 4 --tags smoke"'
    required: false
    default: ''

  set_baseline:
    description: 'Record a passing run as the baseline and upload it for later runs'
    required: false
    default: 'true'

  baseline_artifact:
    description: 'Name of baseline artifact to download/upload'
    required: false
    default: 'loadtest-baseline'

  results_artifact:
    description: 'Name of results artifact to upload'
    required: false
    default: 'loadtest-results'

  post_pr_comment:
    description: 'Post the summary on the pull request, editing the same comment on every push'
    required: false
    default: 'true'

  workflow:
    description: 'Workflow file name to search for baseline artifacts (empty = search all workflows)'
    required: false
    default: ''

  fallback_branch:
    description: 'Branch whose baseline is used when the compared branch has none (empty = the repository default branch)'
    required: false
    default: ''

  github_token:
    description: 'Token for baseline downloads and the PR comment (uses github.token if not provided)'
    required: false

  locomotive_version:
    description: 'Install this Locomotive version from PyPI (empty = the version shipped with this action)'
    required: false
    default: ''

outputs:
  metrics_path:
    description: 'Path to metrics.json file'
    value: ${{ steps.run.outputs.metrics_path }}

  report_path:
    description: 'Path to report.html file'
    value: ${{ steps.run.outputs.report_path }}

  status:
    description: 'Run status: PASS, WARNING, DEGRADATION or NO_DATA'
    value: ${{ steps.run.outputs.status }}

  summary_path:
    description: 'Path to the markdown summary (the job summary and PR comment text)'
    value: ${{ steps.run.outputs.summary_path }}

  junit_path:
    description: 'Path to JUnit XML with one test case per check, for test reporters'
    value: ${{ steps.run.outputs.junit_path }}

# Значения из контекстов (имена веток, inputs) передаются в скрипты только
# через env: подставленные прямо в `run:`, они становятся частью скрипта, и
# ветка с именем вида `$(curl ...)` выполнила бы свой код на раннере.
runs:
  using: 'composite'
  steps:
    - name: Install Locomotive
      shell: bash
      env:
        LOCOMOTIVE_VERSION: ${{ inputs.locomotive_version }}
      run: |
        if ! command -v python3 &> /dev/null; then
          echo "::error title=python3 not found::Add actions/setup-python before this action"
          exit 1
        fi

        python3 -m pip install --quiet --upgrade pip
        if [ -n "$LOCOMOTIVE_VERSION" ]; then
          python3 -m pip install --quiet "locomotive==$LOCOMOTIVE_VERSION"
        else
          # Флаги, которые action передаёт в `loco`, появляются в том же коммите,
          # что и сам action. Библиотека ставится оттуда же, а не с PyPI, где
          # может лежать релиз, который этих флагов ещё не знает.
          python3 -m pip install --quiet "$GITHUB_ACTION_PATH/../../.."
        fi

        echo "Installed:"
        python3 -m pip show locomotive | grep -E "^(Name|Version):" || true

    - name: Resolve baseline branch
      id: branch
      shell: bash
      env:
        BASELINE_BRANCH: ${{ github.base_ref || github.ref_name }}
        FALLBACK_BRANCH: ${{ inputs.fallback_branch || github.event.repository.default_branch || 'main' }}
      run: |
        # Self-hosted раннер хранит workspace между запусками: оставшаяся
        # папка сошла бы за скачанный baseline чужой ветки.
        rm -rf loadtest-artifacts
        echo "baseline=$BASELINE_BRANCH" >> "$GITHUB_OUTPUT"
        echo "fallback=$FALLBACK_BRANCH" >> "$GITHUB_OUTPUT"
        echo "Baseline branch: $BASELINE_BRANCH (fallback: $FALLBACK_BRANCH)"

    - name: Download baseline (branch)
      uses: dawidd6/action-download-artifact@v6
      continue-on-error: true
      with:
        github_token: ${{ inputs.github_token || github.token }}
        workflow: ${{ inputs.workflow }}
        name: ${{ inputs.baseline_artifact }}
        path: loadtest-artifacts/
        branch: ${{ steps.branch.outputs.baseline }}
        workflow_conclusion: ""
        check_artifacts: true
        if_no_artifact_found: warn

    - name: Check baseline downloaded
      id: check-baseline
      shell: bash
      run: |
        if [ -f "loadtest-artifacts/baseline.json" ]; then
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Baseline found"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "No baseline on the first attempt"
        fi

    # Скачивание артефакта — сетевая операция, и обрыв на ней означает не
    # «базлайна нет», а «мы его не дотянули». Разница принципиальная: без
    # повтора одна моргнувшая сеть отключает регрессионный анализ целиком,
    # и прогон рапортует PASS, ничего ни с чем не сравнив.
    - name: Retry baseline download (branch)
      if: steps.check-baseline.outputs.found != 'true'
      uses: dawidd6/action-download-artifact@v6
      continue-on-error: true
      with:
        github_token: ${{ inputs.github_token || github.token }}
        workflow: ${{ inputs.workflow }}
        name: ${{ inputs.baseline_artifact }}
        path: loadtest-artifacts/
        branch: ${{ steps.branch.outputs.baseline }}
        workflow_conclusion: ""
        check_artifacts: true
        if_no_artifact_found: warn

    - name: Check baseline after retry
      id: check-baseline-retry
      shell: bash
      run: |
        if [ -f "loadtest-artifacts/baseline.json" ]; then
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Baseline found"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "Still no baseline for this branch, will try the fallback branch"
        fi

    - name: Download baseline (fallback)
      if: steps.check-baseline-retry.outputs.found != 'true' && steps.branch.outputs.baseline != steps.branch.outputs.fallback
      uses: dawidd6/action-download-artifact@v6
      continue-on-error: true
      with:
        github_token: ${{ inputs.github_token || github.token }}
        workflow: ${{ inputs.workflow }}
        name: ${{ inputs.baseline_artifact }}
        path: loadtest-artifacts/
        branch: ${{ steps.branch.outputs.fallback }}
        workflow_conclusion: ""
        check_artifacts: true
        if_no_artifact_found: warn

    # Прогон без базлайна сравнивает текущие метрики не с прошлым прогоном, а
    # ни с чем — про это надо сказать вслух в логе, иначе единственным следом
    # останется зелёный статус.
    - name: Warn if the comparison has no baseline
      shell: bash
      run: |
        if [ ! -f "loadtest-artifacts/baseline.json" ]; then
          echo "::warning title=No baseline::Regression rules will be skipped: \
        the baseline artifact was not downloaded (missing, expired, or the download failed). \
        Only absolute thresholds will run, so a slowdown against the previous run cannot be caught."
        fi

    # Сводка, JUnit, подрезка хранилища до baseline и текущего прогона — всё
    # это делает сам `loco`, одинаково для GitHub, GitLab и Jenkins.
    - name: Run load test
      id: run
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        USERS: ${{ inputs.users }}
        RUN_TIME: ${{ inputs.run_time }}
        SET_BASELINE: ${{ inputs.set_baseline }}
        EXTRA_ARGS: ${{ inputs.args }}
      run: |
        out_dir="$RUNNER_TEMP/locomotive"
        mkdir -p "$out_dir"

        args=(--config "$CONFIG" ci --storage loadtest-artifacts --prune
              --summary "$out_dir/summary.md" --junit "$out_dir/junit.xml")
        if [ -n "$USERS" ]; then args+=(--users "$USERS"); fi
        if [ -n "$RUN_TIME" ]; then args+=(--run-time "$RUN_TIME"); fi
        if [ "$SET_BASELINE" = "true" ]; then args+=(--set-baseline); fi
        # Дополнительные аргументы намеренно разбиваются по пробелам.
        # shellcheck disable=SC2206
        if [ -n "$EXTRA_ARGS" ]; then args+=($EXTRA_ARGS); fi

        echo "Command: loco ${args[*]}"
        exit_code=0
        loco "${args[@]}" || exit_code=$?
        echo ""
        echo "=== Exit code: $exit_code ==="

        echo "summary_path=$out_dir/summary.md" >> "$GITHUB_OUTPUT"
        echo "junit_path=$out_dir/junit.xml" >> "$GITHUB_OUTPUT"

        # После --prune в хранилище остаются baseline и этот прогон; этот новее.
        run_dir=$(ls -td loadtest-artifacts/runs/*/ 2>/dev/null | head -1 || true)
        status=NO_DATA
        if [ -n "$run_dir" ] && [ -f "${run_dir}metrics.json" ]; then
          echo "metrics_path=${run_dir}metrics.json" >> "$GITHUB_OUTPUT"
          echo "report_path=${run_dir}report.html" >> "$GITHUB_OUTPUT"
          status=PASS
          if [ -f "${run_dir}analysis.json" ]; then
            status=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("status") or "PASS")' "${run_dir}analysis.json")
          fi
        fi
        echo "status=$status" >> "$GITHUB_OUTPUT"

        # У GitHub нет «жёлтого» статуса job — WARNING виден хотя бы аннотацией.
        if [ "$status" = "WARNING" ]; then
          echo "::warning title=Load test: WARNING::A metric crossed its warn threshold; the job summary has the details."
        fi

        exit "$exit_code"

    # Отчёт лежит в артефакте, а артефакт надо скачать и распаковать — чтобы
    # посмотреть одно число, это слишком долго. Сводка прогона рендерится
    # прямо в интерфейсе Actions и открывается одним кликом из списка проверок.
    - name: Write job summary
      if: always()
      shell: bash
      env:
        SUMMARY: ${{ steps.run.outputs.summary_path }}
      run: |
        if [ -n "$SUMMARY" ] && [ -f "$SUMMARY" ]; then
          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          printf '\nThe HTML report with charts is in the artifacts of this run.\n' >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload results
      id: results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.results_artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: loadtest-artifacts/
        retention-days: 30
        if-no-files-found: warn

    - name: Upload baseline
      if: inputs.set_baseline == 'true' && always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.baseline_artifact }}
        path: loadtest-artifacts/
        retention-days: 90
        overwrite: true
        if-no-files-found: ignore

    # Один комментарий на PR: следующий push правит его, а не добавляет новый.
    # Ошибка комментария (например, read-only токен у PR из форка) не должна
    # ронять проверку, результат которой уже есть в сводке.
    - name: Post PR comment
      if: always() && inputs.post_pr_comment == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
      continue-on-error: true
      shell: bash
      env:
        SUMMARY: ${{ steps.run.outputs.summary_path }}
        ARTIFACT_URL: ${{ steps.results.outputs.artifact-url }}
        GITHUB_TOKEN: ${{ inputs.github_token || github.token }}
      run: |
        if [ -z "$SUMMARY" ] || [ ! -f "$SUMMARY" ]; then
          echo "No summary was written; skipping the comment"
          exit 0
        fi
        body="$RUNNER_TEMP/locomotive/comment.md"
        cp "$SUMMARY" "$body"
        if [ -n "$ARTIFACT_URL" ]; then
          printf '\n[Download the HTML report](%s)\n' "$ARTIFACT_URL" >> "$body"
        fi
        loco comment --body "$body"
