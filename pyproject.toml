[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "locomotive"
version = "0.3.1"
description = "CI/CD load testing runner and regression analyzer for Locust"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [
  {name = "Daria Edigareva"},
]
keywords = ["locust", "load-testing", "ci", "performance", "regression"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Benchmark",
]
dependencies = [
  "PyYAML>=6.0",
  # 2.11 is where a worker first learns its own index (MasterRunner sends it
  # in the ack). Older masters report -1, and without an index there is no
  # way to give each worker a different slice of a data pool.
  "locust>=2.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/locomotive-lib/locomotive"
Repository = "https://github.com/locomotive-lib/locomotive"
Issues = "https://github.com/locomotive-lib/locomotive/issues"

[project.scripts]
loco = "locomotive.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: runs real locust against a real HTTP server (slow; skipped without the locust binary)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["locomotive*"]
